#
# Sample 2-cell monolithic gNB config demonstrating the gNBs[n].cells[c] structure.
# Cell 0: band 78, 106 PRBs, SSB 3451 MHz (pointA 3432 MHz), PCI 0
# Cell 1: band 78, 106 PRBs, SSB 3649 MHz (pointA 3630 MHz), PCI 1

Active_gNBs:
  - gnb-rfsim
Asn1_verbosity: none

gNBs:
  - gNB_ID: 0xe00
    gNB_name: gnb-rfsim

    cells:
      ############ Cell 0: 3451 MHz, PCI 0 ############
      - tracking_area_code: 1
        plmn_list:
          - mcc: 001
            mnc: 01
            mnc_length: 2
            snssaiList:
              - sst: 1
                sd: 0xffffff
        nr_cellid: 12345678
        ##### Physical parameters:
        pdsch_AntennaPorts_N1: 1
        pdsch_AntennaPorts_N2: 1
        pdsch_AntennaPorts_XP: 1
        pusch_AntennaPorts: 1
        maxMIMO_layers: 1
        min_rxtxtime: 4
        do_CSIRS: 1
        do_SRS: "none"
        ##### Scheduler parameters:
        pusch_TargetSNRx10: 200
        pucch_TargetSNRx10: 200
        pusch_FailureThres: 1000
        servingCellConfigCommon:
          - physCellId: 0
          #  downlinkConfigCommon
          #  frequencyInfoDL
          # this is 3451 MHz + 43 PRBs@30kHz SCS (same as initial BWP)
            absoluteFrequencySSB: 630048
            dl_frequencyBand: 78
            # this is 3432 MHz
            dl_absoluteFrequencyPointA: 628776
            # scs-SpecificCarrierList
            dl_offstToCarrier: 0
            # subcarrierSpacing: 0=kHz15, 1=kHz30, 2=kHz60, 3=kHz120
            dl_subcarrierSpacing: 1
            dl_carrierBandwidth: 106
            # initialDownlinkBWP
            # this is RBstart=27,L=48 (275*(L-1))+RBstart
            initialDLBWPlocationAndBandwidth: 28875
            # subcarrierSpacing: 0=kHz15, 1=kHz30, 2=kHz60, 3=kHz120
            initialDLBWPsubcarrierSpacing: 1
            # pdcch-ConfigCommon
            initialDLBWPcontrolResourceSetZero: 12
            initialDLBWPsearchSpaceZero: 0
            # uplinkConfigCommon
            # frequencyInfoUL
            ul_frequencyBand: 78
            # scs-SpecificCarrierList
            ul_offstToCarrier: 0
            # subcarrierSpacing: 0=kHz15, 1=kHz30, 2=kHz60, 3=kHz120
            ul_subcarrierSpacing: 1
            ul_carrierBandwidth: 106
            pMax: 20
            # initialUplinkBWP
            initialULBWPlocationAndBandwidth: 28875
            # subcarrierSpacing: 0=kHz15, 1=kHz30, 2=kHz60, 3=kHz120
            initialULBWPsubcarrierSpacing: 1
            # rach-ConfigCommon
            prach_ConfigurationIndex: 98
            # prach_msg1_FDM: 0=one, 1=two, 2=four, 3=eight
            prach_msg1_FDM: 0
            prach_msg1_FrequencyStart: 0
            zeroCorrelationZoneConfig: 13
            preambleReceivedTargetPower: -96
            # preambleTransMax: (0..10) = (3,4,5,6,7,8,10,20,50,100,200)
            preambleTransMax: 6
            # powerRampingStep: 0=dB0, 1=dB2, 2=dB4, 3=dB6
            powerRampingStep: 1
            # ssb_perRACH_OccasionAndCB_PreamblesPerSSB_PR: 4=one
            ssb_perRACH_OccasionAndCB_PreamblesPerSSB_PR: 4
            ssb_perRACH_OccasionAndCB_PreamblesPerSSB: 14
            # ra_ContentionResolutionTimer: (0..7) = (8,16,24,32,40,48,56,64)
            ra_ContentionResolutionTimer: 7
            rsrp_ThresholdSSB: 19
            # prach_RootSequenceIndex_PR: 1=839, 2=139
            prach_RootSequenceIndex_PR: 2
            prach_RootSequenceIndex: 1
            # SCS for msg1, can only be 15 for 30 kHz < 6 GHz
            msg1_SubcarrierSpacing: 1
            # restrictedSetConfig: 0=unrestricted, 1=type A, 2=type B
            restrictedSetConfig: 0
            msg3_DeltaPreamble: 1
            p0_NominalWithGrant: -90
            # pucch-ConfigCommon
            # pucchGroupHopping: 0=neither, 1=group hopping, 2=sequence hopping
            pucchGroupHopping: 0
            hoppingId: 40
            p0_nominal: -90
            ssb_PositionsInBurst_Bitmap: 1
            # ssb_periodicityServingCell: 0=ms5, 1=ms10, 2=ms20, ...
            ssb_periodicityServingCell: 2
            # dmrs_TypeA_Position: 0=pos2, 1=pos3
            dmrs_TypeA_Position: 0
            # subcarrierSpacing: 0=kHz15, 1=kHz30, 2=kHz60, 3=kHz120
            subcarrierSpacing: 1
            # tdd-UL-DL-ConfigurationCommon
            # subcarrierSpacing: 0=kHz15, 1=kHz30, 2=kHz60, 3=kHz120
            referenceSubcarrierSpacing: 1
            # dl_UL_TransmissionPeriodicity: 0=ms0p5, ..., 6=ms5, 7=ms10
            dl_UL_TransmissionPeriodicity: 6
            nrofDownlinkSlots: 7
            nrofDownlinkSymbols: 6
            nrofUplinkSlots: 2
            nrofUplinkSymbols: 4
            ssPBCH_BlockPower: -25

      ############ Cell 1: 3649 MHz, PCI 1 ############
      - tracking_area_code: 1
        plmn_list:
          - mcc: 001
            mnc: 01
            mnc_length: 2
            snssaiList:
              - sst: 1
                sd: 0xffffff
        nr_cellid: 11111111
        ##### Physical parameters:
        pdsch_AntennaPorts_N1: 1
        pdsch_AntennaPorts_N2: 1
        pdsch_AntennaPorts_XP: 1
        pusch_AntennaPorts: 1
        maxMIMO_layers: 1
        min_rxtxtime: 4
        do_CSIRS: 1
        do_SRS: "none"
        ##### Scheduler parameters:
        pusch_TargetSNRx10: 200
        pucch_TargetSNRx10: 200
        pusch_FailureThres: 1000
        servingCellConfigCommon:
          - physCellId: 1
          #  downlinkConfigCommon
          #  frequencyInfoDL
          # this is 3649 MHz + 43 PRBs@30kHz SCS (same as initial BWP)
            absoluteFrequencySSB: 643296
            dl_frequencyBand: 78
            # this is 3630 MHz
            dl_absoluteFrequencyPointA: 642024
            # scs-SpecificCarrierList
            dl_offstToCarrier: 0
            # subcarrierSpacing: 0=kHz15, 1=kHz30, 2=kHz60, 3=kHz120
            dl_subcarrierSpacing: 1
            dl_carrierBandwidth: 106
            # initialDownlinkBWP
            # this is RBstart=27,L=48 (275*(L-1))+RBstart
            initialDLBWPlocationAndBandwidth: 28875
            # subcarrierSpacing: 0=kHz15, 1=kHz30, 2=kHz60, 3=kHz120
            initialDLBWPsubcarrierSpacing: 1
            # pdcch-ConfigCommon
            initialDLBWPcontrolResourceSetZero: 12
            initialDLBWPsearchSpaceZero: 0
            # uplinkConfigCommon
            # frequencyInfoUL
            ul_frequencyBand: 78
            # scs-SpecificCarrierList
            ul_offstToCarrier: 0
            # subcarrierSpacing: 0=kHz15, 1=kHz30, 2=kHz60, 3=kHz120
            ul_subcarrierSpacing: 1
            ul_carrierBandwidth: 106
            pMax: 20
            # initialUplinkBWP
            initialULBWPlocationAndBandwidth: 28875
            # subcarrierSpacing: 0=kHz15, 1=kHz30, 2=kHz60, 3=kHz120
            initialULBWPsubcarrierSpacing: 1
            # rach-ConfigCommon
            prach_ConfigurationIndex: 98
            # prach_msg1_FDM: 0=one, 1=two, 2=four, 3=eight
            prach_msg1_FDM: 0
            prach_msg1_FrequencyStart: 0
            zeroCorrelationZoneConfig: 13
            preambleReceivedTargetPower: -96
            # preambleTransMax: (0..10) = (3,4,5,6,7,8,10,20,50,100,200)
            preambleTransMax: 6
            # powerRampingStep: 0=dB0, 1=dB2, 2=dB4, 3=dB6
            powerRampingStep: 1
            # ssb_perRACH_OccasionAndCB_PreamblesPerSSB_PR: 4=one
            ssb_perRACH_OccasionAndCB_PreamblesPerSSB_PR: 4
            ssb_perRACH_OccasionAndCB_PreamblesPerSSB: 14
            # ra_ContentionResolutionTimer: (0..7) = (8,16,24,32,40,48,56,64)
            ra_ContentionResolutionTimer: 7
            rsrp_ThresholdSSB: 19
            # prach_RootSequenceIndex_PR: 1=839, 2=139
            prach_RootSequenceIndex_PR: 2
            prach_RootSequenceIndex: 1
            # SCS for msg1, can only be 15 for 30 kHz < 6 GHz
            msg1_SubcarrierSpacing: 1
            # restrictedSetConfig: 0=unrestricted, 1=type A, 2=type B
            restrictedSetConfig: 0
            msg3_DeltaPreamble: 1
            p0_NominalWithGrant: -90
            # pucch-ConfigCommon
            # pucchGroupHopping: 0=neither, 1=group hopping, 2=sequence hopping
            pucchGroupHopping: 0
            hoppingId: 41
            p0_nominal: -90
            ssb_PositionsInBurst_Bitmap: 1
            # ssb_periodicityServingCell: 0=ms5, 1=ms10, 2=ms20, ...
            ssb_periodicityServingCell: 2
            # dmrs_TypeA_Position: 0=pos2, 1=pos3
            dmrs_TypeA_Position: 0
            # subcarrierSpacing: 0=kHz15, 1=kHz30, 2=kHz60, 3=kHz120
            subcarrierSpacing: 1
            # tdd-UL-DL-ConfigurationCommon
            # subcarrierSpacing: 0=kHz15, 1=kHz30, 2=kHz60, 3=kHz120
            referenceSubcarrierSpacing: 1
            # dl_UL_TransmissionPeriodicity: 0=ms0p5, ..., 6=ms5, 7=ms10
            dl_UL_TransmissionPeriodicity: 6
            nrofDownlinkSlots: 7
            nrofDownlinkSymbols: 6
            nrofUplinkSlots: 2
            nrofUplinkSymbols: 4
            ssPBCH_BlockPower: -25

    SCTP:
      SCTP_INSTREAMS: 2
      SCTP_OUTSTREAMS: 2

    amf_ip_address:
      - ipv4: 172.31.0.132

    NETWORK_INTERFACES:
      GNB_IPV4_ADDRESS_FOR_NG_AMF: 172.31.0.1
      GNB_IPV4_ADDRESS_FOR_NGU: 172.31.0.1
      GNB_PORT_FOR_S1U: 2152

MACRLCs:
  - tr_s_preference: local_L1
    tr_n_preference: local_RRC

L1s:
  - tr_n_preference: local_mac
    prach_dtx_threshold: 200
    pucch0_dtx_threshold: 150

RUs:
  - local_rf: yes
    nb_tx: 1
    nb_rx: 1
    att_tx: 0
    att_rx: 0
    bands: [78]
    max_pdschReferenceSignalPower: -27
    max_rxgain: 114
    eNB_instances: [0]

rfsimulator:
  - serveraddr: server

security:
  # preferred ciphering algorithms
  # the first one of the list that an UE supports in chosen
  # valid values: nea0, nea1, nea2, nea3
  ciphering_algorithms: [nea0]

  # preferred integrity algorithms
  # the first one of the list that an UE supports in chosen
  # valid values: nia0, nia1, nia2, nia3
  integrity_algorithms: [nia2, nia0]

  # setting 'drb_ciphering' to "no" disables ciphering for DRBs, no matter
  # what 'ciphering_algorithms' configures; same thing for 'drb_integrity'
  drb_ciphering: yes
  drb_integrity: no

log_config:
  global_log_level: info
  hw_log_level: info
  phy_log_level: info
  mac_log_level: info
  rlc_log_level: info
  pdcp_log_level: info
  rrc_log_level: info
  ngap_log_level: info
  f1ap_log_level: info
